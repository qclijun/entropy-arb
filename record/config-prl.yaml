# Public-data collection configuration. Launch only with --record-only.
# Thresholds are inherited placeholders, not fitted trading parameters.
thresholds:
  midline_bps: 0.0
  upper_bps: 4.0
  lower_bps: 4.0
entropy:
  dex: io
  taker_fee_bps: 0.9
  max_position_usd: 1000
  max_orders_per_min: 120
hedge:
  taker_fee_bps: 0.0
  max_position_usd: 1000
  max_orders_per_min: 30
sizing:
  take_fraction: 0.5
  max_order_notional_usd: 500
  min_order_notional_usd: 10
inventory:
  scale_bps: 10.0
  floor_frac: 0
execution:
  premium_persist_sec: 0
  cooldown_sec: 0.0
  settle_timeout_sec: 10.0
  leg_slippage_bps: 50.0
  hedge_slippage_bps: 20.0
  net_tolerance_base: 0.001
  max_consecutive_errors: 3
  rate_limit_pause_sec: 10.0
  staleness_sec: 10.0
  reconcile_sec: 15.0
  venue_probe_sec: 30.0
  http_keepalive_sec: 10.0
recorder:
  enabled: true
  csv: ../logs/minutes-lighter.csv
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: ../logs/trades-lighter.csv
  dashboard: false
  file: logs/engine-prl-lighter.log
